# STM32WLE5 has no USB device controller; the AT port is lpuart1 (PA2/PA3).
# The 208 KiB image-0 slot cannot hold the USP stack plus the USB device stack.

CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=n
# LTO needs local ISR declarations when the vector table is generated.
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
# Debug prints share LPUART1 with AT. The log subsystem does not fit in the 208 KiB slot.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
# The 8 KiB settings area may still hold a previous modem image.
# Erase it when every sector looks closed so the first DevEUI write can format NVS.
CONFIG_NVS_INIT_BAD_MEMORY_REGION=y
# Boot formats NVS on this stack. 1024 bytes overflows once PM and the RTC counter init run.
CONFIG_MAIN_STACK_SIZE=4096
# Idle enters STOP through pm_system_suspend(). The 256-byte default overflows.
CONFIG_IDLE_STACK_SIZE=512

CONFIG_PM=y
CONFIG_RZI_POWER=y
# RTC keeps time and provides the wake alarm while SysTick stops.
# AT+LPMLVL=1 enters STOP1. AT+LPMLVL=2 enters STOP2. Default is 1.
# Wake on LPUART data. Do not poll while idle.
CONFIG_COUNTER=y
CONFIG_COUNTER_RTC_STM32_SUBSECONDS=y
CONFIG_SYSTEM_TIMER_LPM_COMPANION_COUNTER=y
CONFIG_RZI_USP_IDLE_UNTIL_INIT=y
