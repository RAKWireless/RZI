CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_FLASH=y
CONFIG_PM_DEVICE=y
CONFIG_TEST_RANDOM_GENERATOR=y

# The AT service owns its UART. Keep logs and the console off that port.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_LINE_CTRL=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

CONFIG_MAIN_STACK_SIZE=4096
# RAK3372 has 64 KiB RAM. The AT thread and its receive ring share that with FUOTA.
CONFIG_HEAP_MEM_POOL_SIZE=2048

CONFIG_LORA=n
CONFIG_LORAWAN=n

CONFIG_RZI=y
CONFIG_RZI_LORAWAN=y
CONFIG_RZI_AT=y
CONFIG_RZI_AT_COMMAND_LORAWAN=y
CONFIG_RZI_AT_ADAPTER_UART=y
CONFIG_RZI_AT_NVM=y
CONFIG_SETTINGS_NVS=y
CONFIG_RZI_AT_THREAD_STACK_SIZE=4096
CONFIG_RZI_AT_RX_BUFFER_SIZE=256
# Downlink formatting runs on this stack and needs more than 2 KiB.
CONFIG_RZI_LORAWAN_DISPATCHER_STACK_SIZE=3072
CONFIG_RZI_MCUBOOT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_RZI_LORAWAN_FUOTA=y
CONFIG_RZI_LORAWAN_EVENT_QUEUE_SIZE=8
CONFIG_LORA_BASICS_MODEM_DRIVERS_EVENT_TRIGGER_NO_THREAD=y
# Certification, radio test mode, CSMA and FMP are not used by this sample.
CONFIG_LORA_BASICS_MODEM_CERTIFICATION=n
CONFIG_LORA_BASICS_MODEM_TEST_MODE=n
CONFIG_LORA_BASICS_MODEM_CSMA=n
CONFIG_LORA_BASICS_MODEM_FUOTA_FMP=n

# Uplink log: boot report reset reason.
CONFIG_HWINFO=y

# Match ChirpStack device-profile package versions (v1 by default).
CONFIG_LORA_BASICS_MODEM_FUOTA_V1=y
# EU868 DR2-DR4 application payloads are 51, 115 and 222 bytes. A data
# fragment keeps 3 bytes for the command and index, so the data sizes are
# 48, 112 and 219. 4438 x 48 covers one 208 KiB slot1 image at DR2.
# Redundancy is an absolute fragment count: 200 is about 20% at DR4,
# 10% at DR3 and 4.5% at DR2. The parity matrix cannot hold 20% of 4438.
CONFIG_LORA_BASICS_MODEM_FUOTA_MAX_NB_OF_FRAGMENTS_CONFIG=y
CONFIG_LORA_BASICS_MODEM_FUOTA_MAX_NB_OF_FRAGMENTS=4438
CONFIG_LORA_BASICS_MODEM_FUOTA_MAX_SIZE_OF_FRAGMENTS_CONFIG=y
CONFIG_LORA_BASICS_MODEM_FUOTA_MAX_SIZE_OF_FRAGMENTS=242
CONFIG_LORA_BASICS_MODEM_FUOTA_MAX_FRAGMENTS_REDUNDANCY_CONFIG=y
CONFIG_LORA_BASICS_MODEM_FUOTA_MAX_FRAGMENTS_REDUNDANCY=200
