patches:
  - path: usp/0001-export-secure-element-session-keys.patch
    sha256sum: e36f6f69a855a12969801a8c19f19e13903c7503683a5d7a2c074a33fe78b27a
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-09-28
    upstreamable: true
    apply-command: git apply
    comments: |
      Export session keys from the software secure element so OTAA getters
      can read NwkSKey and AppSKey after join. The LR11xx crypto engine
      cannot export key material and returns an error.

  - path: usp/0002-ral-sx126x-frequency-limits.patch
    sha256sum: 91ea0d9d82b4a2447d5170948d307a233af23361c448fdac75e8ba28fb4fff54
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-10-11
    upstreamable: true
    apply-command: git apply
    comments: |
      Select the SX1261/SX1262 or SX1268 frequency limits with #if/#else.
      Upstream defines the SX1268 limits first and redefines them without
      #undef, which fails every SX1262 build under -Werror (twister).

  - path: usp/0003-user-channel-mask.patch
    sha256sum: 22f73b62339cda5294bdb920e5e97e44c3eabd85c2e2a7c577f32a0261a7f24e
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-10-11
    upstreamable: true
    apply-command: git apply
    comments: |
      Add smtc_modem_set/get_channel_mask() so the application can limit the
      US915 / AU915 / CN470 uplink channels before join (AT+MASK, AT+CHE,
      AT+CHS). The mask is ANDed into every default channel mask and the
      US915 / AU915 snapshots ignore disabled channels. LinkADRReq and the ADR
      back-off are unchanged.

  - path: usp/0004-reuse-license-annotations.patch
    sha256sum: 2ece2fe85f42c0826caed7c3e0bf0e905096e4e88a9819bc9acc347dea83e429
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-10-12
    upstreamable: true
    apply-command: git apply
    comments: |
      Add a REUSE.toml so west spdx attributes licenses and copyrights in the
      firmware SBOM. Semtech sources carry the Clear BSD text without SPDX
      tags; base64 is BSD-3-Clause, and the Gladman AES and Casado/Tsigas CMAC
      files get LicenseRef identifiers for the texts kept in LICENSES.txt.

  - path: usp/0005-fuota-session-hooks.patch
    sha256sum: 17580fd4ebe68b43ec87b27f2cfc546c96a3a81e3faf41e8f2a8d29c0f2adf57
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-11-20
    upstreamable: true
    apply-command: git apply
    comments: |
      Let RZI register v1 fragmentation hooks. session_setup runs before the
      decoder starts, and store/restore replace CONTEXT_FUOTA for the
      reconstructed bytes. With hooks, the same setup is answered 0200 without
      erasing, a conflicting active session is rejected, a dropped stored byte
      fails the session, and a unicast StatusReq is not delayed by BlockAckDelay.
      StatusAns or DeleteAns is reported after local transmission. Class C
      acceptance captures the class still in force. Application uplinks are not
      launched while FUOTA owns the radio or a package answer is queued.
      Without hooks the package keeps its previous behavior.

  - path: usp/0015-optional-certification-and-test-mode.patch
    sha256sum: 4edcbc0786fef38b2e332bfeef13d352e762a59225085ba087f236757f5ac9a4
    module: usp
    author: rzi
    email: patches@rzi.local
    date: 2026-11-16
    upstreamable: true
    apply-command: git apply
    comments: |
      Make the LoRaWAN certification package and radio test mode optional
      (ADD_LBM_CERTIFICATION, ADD_LBM_TEST_MODE), elide empty service loops,
      and skip test-mode busy checks when ADD_LBM_TEST_MODE is disabled.

  - path: usp_zephyr/0005-stm32wl-subghz-radio.patch
    sha256sum: 1918961136fe1791d9abc29aee44bc07c2e4a786590195600322d7dd8e5f3bfc
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-11-15
    upstreamable: true
    apply-command: git apply
    comments: |
      Add standalone STM32WL on-chip SUBGHZ transceiver support
      (stm32wl_subghz_hal.c and stm32wl_subghz_board.c) for
      st,stm32wl-subghz-radio, compiled instead of sx126x_hal.c and
      sx126x_board.c. Drive SUBGHZSPI, NSS, RFBUSY, RCC reset (with HSI
      parking when SYSCLK uses PB0-VDD_TCXO), EXTI 44 level IRQ masking,
      RFO_HP/RFO_LP PA configuration, and optional RF switch GPIOs directly
      like ST's stm32wlxx_hal_subghz.c.

  - path: usp_zephyr/0006-zephyr-4.5-warning-fixes.patch
    sha256sum: 4efddffabb89bec2f54c11ffeb7356baed8d5fff92ea4c75a10e597855276eba
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-09-21
    upstreamable: true
    apply-command: git apply
    comments: |
      Update for Zephyr 4.5 APIs: include zephyr/sys/clock.h instead of
      the deprecated sys_clock.h wrapper, and replace SPI_OP_MODE_MASTER with
      SPI_OP_MODE_CONTROLLER in the USP radio board files.

  - path: usp_zephyr/0007-reuse-license-annotations.patch
    sha256sum: 62eb93d0a433a78e4a8c68bd399de5a4fdbcebc6bf9d6d48af7f59e43e8c26dd
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-12
    upstreamable: true
    apply-command: git apply
    comments: |
      Add a REUSE.toml so west spdx attributes the Clear BSD license and
      Semtech copyright to sources and build files that carry no SPDX tags.
      Files with their own SPDX tags keep them.

  - path: usp_zephyr/0012-skip-disabled-log-formatting.patch
    sha256sum: cff3db2a8961e529cd3425783bde7bcacaae20d2202aceb8ba6c46ec7cf37441
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-11-09
    upstreamable: true
    apply-command: git apply
    comments: |
      Gate USP and LBM trace formatting on Z_LOG_CONST_LEVEL_CHECK(level)
      across both debug-trace headers and follow CONFIG_USP_LOG_LEVEL in
      the USP helpers, so filtered or disabled log levels elide format
      strings and snprintf() calls at compile time.

  - path: usp_zephyr/0013-gate-2g4-region-on-radio-support.patch
    sha256sum: dcb6e16c5ea2cceddd76308d7d11c64c762edcbaa2c14a54f43d29afd2b2d0d3
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-11-09
    upstreamable: true
    apply-command: git apply
    comments: |
      Only enable the WW_2G4 region for supported 2.4 GHz transceivers.
      The all-regions option retains every Sub-GHz region on STM32WL and
      SX126x boards without compiling the unsupported 2.4 GHz region.

  - path: usp_zephyr/0014-usp-idle-until-init.patch
    sha256sum: a002361f092fe2a230ca5b14e1a5718e7a683794a80c813b7bcea115da6cd657
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-11-10
    upstreamable: true
    apply-command: git apply
    comments: |
      When CONFIG_RZI_USP_IDLE_UNTIL_INIT=y, let the USP thread sleep until
      the modem is initialized instead of polling every 50 ms.

  - path: usp_zephyr/0016-optional-certification-and-test-mode.patch
    sha256sum: b166fc13c06b8c8e9f8b4eb5a1ffef11d34d8e08ac09a00ad915c62632056ab7
    module: usp_zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-11-16
    upstreamable: true
    apply-command: git apply
    comments: |
      Add LORA_BASICS_MODEM_CERTIFICATION and LORA_BASICS_MODEM_TEST_MODE
      (both default y) so firmware can exclude lorawan_certification.c and
      smtc_modem_test.c.

  - path: zephyr/0009-stm32wl-locked-pm-resume.patch
    sha256sum: 22b3f283240da422119fcb8ccb2cd0f39f62f153073ec22a23086749eee19b92
    module: zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-15
    upstreamable: true
    apply-command: git apply
    comments: |
      Keep STM32WL wake interrupts pending until PM restores clocks and
      system-managed devices. Matches upstream
      https://github.com/zephyrproject-rtos/zephyr/pull/122293.
      Drop this patch once the pinned Zephyr revision contains it.

  - path: zephyr/0010-stm32-spi-resume-config.patch
    sha256sum: 544b6c60762a6cdc384ca8cc8444da64299f28bf0302167f4ff8ce8ea51b63a2
    module: zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-15
    upstreamable: true
    apply-command: git apply
    comments: |
      STOP may clear STM32 SPI CR1/CR2 while the driver still caches the
      spi_config pointer. Invalidate that cache on resume. Matches upstream
      https://github.com/zephyrproject-rtos/zephyr/pull/122292.
      Drop this patch once the pinned Zephyr revision contains it.

  - path: zephyr/0011-spi-nor-dpd-resume-delay.patch
    sha256sum: 23a65793bdcd05d75e6e1684e63c116eb94a3aa08a31c66ee393f0baa681a9fb
    module: zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-10-15
    upstreamable: true
    apply-command: git apply
    comments: |
      System-managed PM resume leaves SPI NOR deep power-down from the idle
      thread while wake interrupts are masked. Busy-wait when the caller
      cannot yield. Matches upstream
      https://github.com/zephyrproject-rtos/zephyr/pull/122312.
      Drop this patch once the pinned Zephyr revision contains it.

  - path: zephyr/0012-stm32wl-lpuart-wakeup-drain.patch
    sha256sum: 146f63dbe991944ef0fa9067f1349b35096fe7c848e060e77a9c1a19a6c2ddd7
    module: zephyr
    author: rzi
    email: patches@rzi.local
    date: 2026-11-10
    upstreamable: true
    apply-command: git apply
    comments: |
      Drain the STM32WL LPUART FIFO after STOP and before the PM core
      restores clocks. Apply after zephyr/0009, which leaves wake IRQs
      masked across that window. The AT UART adapter supplies the drain.
